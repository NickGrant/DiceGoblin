<section class="container-xl d-flex">
  <div class="landing-frame dg-page-frame dg-surface-banner">
    <div class="row">
      <div class="col-4 d-flex">
        <img class="landing-logo" src="/assets/hero_logo.png" alt="Dice Goblins logo" />
      </div>
      <div class="col-8">
        <p class="dg-surface-banner__eyebrow dg-stencil">Dice Goblins</p>
        <h1>Report for Duty</h1>
        <p class="dg-surface-banner__copy">Rally your warband, manage your supplies, and prepare for the next raid.</p>
        <a dgCommandBtn="primary" [href]="loginUrl">Sign in through Discord</a>
      </div>
    </div>
  </div>
</section>
