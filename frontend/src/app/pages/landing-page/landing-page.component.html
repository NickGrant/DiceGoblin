<section class="landing-page">
  <div class="container-xl landing-page__shell">
    <div class="landing-frame page-frame dg-surface-banner">
      <div class="row">
        <div class="col-4 d-flex">
          <img class="landing-logo" src="/assets/ui/branding/hero-logo.png" alt="Dice Goblins logo" />
        </div>
        <div class="col-8">
          <p class="dg-surface-banner__eyebrow dg-stencil">Dice Goblins</p>
          <h1>Report for Duty</h1>
          <p class="dg-surface-banner__copy">Rally your warband, manage your supplies, and prepare for the next raid.</p>
          <div class="landing-actions">
            <a dgCommandBtn="primary" [href]="loginUrl">Sign in through Discord</a>
            <a dgCommandBtn="teal" routerLink="/guide">How to Play</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
