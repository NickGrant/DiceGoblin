<page-frame
  [breadcrumbs]="[{ label: 'Home' }]"
  title="Prep the warband, then send them raiding."
  [subtitle]="subtitle()"
  headerVariant="home"
>
  <div class="home-grid">
    <div class="home-grid__layout">
      <div class="home-grid__tile home-grid__tile--primary">
        <a class="dg-media-card dg-media-card--feature" [routerLink]="primaryRoute()">
          <img class="dg-media-card__media" [src]="hasActiveRun() ? '/assets/ui/panels/home_continue_run.jpg' : '/assets/ui/panels/home_start_run.jpg'" alt="" />
          <div class="dg-media-card__overlay">
            <span class="dg-media-card__title dg-stencil">{{ primaryLabel() }}</span>
            <span class="dg-media-card__copy">{{ hasActiveRun() ? 'Back to "work".' : 'Your neighbors surely have some good stuff...' }}</span>
          </div>
        </a>
      </div>

      <div class="home-grid__tile">
        <a class="dg-media-card dg-media-card--compact" routerLink="/warband">
          <img class="dg-media-card__media" src="/assets/ui/panels/home_warband.jpg" alt="" />
          <div class="dg-media-card__overlay">
            <span class="dg-media-card__title dg-stencil">Warband</span>
          </div>
        </a>
      </div>

      @if (academyUnlocked()) {
      <div class="home-grid__tile">
        <a class="dg-media-card dg-media-card--compact" routerLink="/academy">
          <img class="dg-media-card__media" src="/assets/ui/panels/academy.jpg" alt="" />
          <div class="dg-media-card__overlay">
            <span class="dg-media-card__title dg-stencil">Academy</span>
          </div>
        </a>
      </div>
      }

      <div class="home-grid__tile">
        @if (shopUnlocked()) {
        <a class="dg-media-card dg-media-card--compact" routerLink="/shop">
          <img class="dg-media-card__media" src="/assets/ui/panels/home_shop.jpg" alt="" />
          <div class="dg-media-card__overlay">
            <span class="dg-media-card__title dg-stencil">Shop</span>
          </div>
        </a>
        } @else {
        <div class="dg-media-card dg-media-card--compact is-disabled home-grid__locked-card" aria-disabled="true">
          <img class="dg-media-card__media" src="/assets/ui/panels/home_shop.jpg" alt="" />
          <div class="dg-media-card__overlay">
            <span class="dg-media-card__title dg-stencil">Shop Locked</span>
            <span class="dg-media-card__copy">Defeat The Farm to free the Tooth Collector.</span>
          </div>
        </div>
        }
      </div>

      <div class="home-grid__tile">
        <a class="dg-media-card dg-media-card--compact" routerLink="/dice">
          <img class="dg-media-card__media" src="/assets/ui/panels/home_inventory.jpg" alt="" />
          <div class="dg-media-card__overlay">
            <span class="dg-media-card__title dg-stencil">Inventory</span>
          </div>
        </a>
      </div>

      @if (devPanelEnabled) {
      <div class="home-grid__tile">
        <a class="dg-media-card dg-media-card--compact" routerLink="/debug">
          <div class="dg-media-card__media dg-media-card__media--dev"></div>
          <div class="dg-media-card__overlay">
            <span class="dg-media-card__title dg-stencil">Dev Panel</span>
          </div>
        </a>
      </div>
      }
    </div>
  </div>
</page-frame>
