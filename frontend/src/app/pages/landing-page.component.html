<section class="landing-shell container-xl px-3 px-md-4">
  <div class="row justify-content-center">
    <div class="col-12 col-xl-10">
      <div class="landing-frame dg-page-frame">
        <div class="row g-0">
          <div class="col-lg-7">
            <div class="landing-copy">
              <p class="landing-kicker dg-stencil">Dice Goblins</p>
              <h1>Report for Duty</h1>
              <p class="landing-body">
                Rally your warband, manage your supplies, and prepare for the next raid.
              </p>
              <div class="d-flex flex-wrap gap-3">
                <a class="dg-command-btn dg-command-btn--primary" [href]="loginUrl">Report Through Discord</a>
                <a class="dg-command-btn" routerLink="/home">Enter Headquarters</a>
              </div>
            </div>
          </div>

          <div class="col-lg-5">
            <div class="landing-poster">
              <img src="/assets/hero_logo.png" alt="Dice Goblins logo" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
