<dg-page-frame eyebrow="Route / Debug" title="Debug Panel" subtitle="Grant resources and inspect catalog entries.">
  <div class="vstack gap-2 mb-3" *ngIf="error() || message() || loading()">
    <dg-alert tone="error" *ngIf="error()">{{ error() }}</dg-alert>
    <dg-alert tone="success" *ngIf="message()">{{ message() }}</dg-alert>
    <dg-alert *ngIf="loading()">Loading debug catalog...</dg-alert>
  </div>

  <div class="row g-4" *ngIf="catalog() as catalog">
    <div class="col-lg-6">
      <div class="dg-card p-3 h-100">
        <h2 class="dg-stencil mb-3">Grants</h2>
        <div class="vstack gap-3">
          <div>
            <label class="form-label">Soft Currency</label>
            <input class="dg-input" type="number" [(ngModel)]="currencySoft" />
          </div>
          <button dgCommandBtn type="button" (click)="grantCurrency()" [disabled]="busy()">Grant Currency</button>

          <div>
            <label class="form-label">Unit</label>
            <select class="dg-select" [(ngModel)]="selectedUnitSlug">
              <option *ngFor="let item of catalog.unit_types" [value]="item.slug">{{ item.name }}</option>
            </select>
          </div>
          <button dgCommandBtn type="button" (click)="grantUnit()" [disabled]="busy()">Grant Unit</button>

          <div class="row g-2">
            <div class="col-sm-6">
              <label class="form-label">Dice Sides</label>
              <select class="dg-select" [(ngModel)]="selectedSides">
                <option *ngFor="let item of catalog.dice_definitions" [ngValue]="item.sides">d{{ item.sides }}</option>
              </select>
            </div>
            <div class="col-sm-6">
              <label class="form-label">Rarity</label>
              <select class="dg-select" [(ngModel)]="selectedRarity">
                <option value="common">common</option>
                <option value="uncommon">uncommon</option>
                <option value="rare">rare</option>
              </select>
            </div>
          </div>
          <button dgCommandBtn type="button" (click)="grantDie()" [disabled]="busy()">Grant Die</button>

          <div>
            <label class="form-label">Region Item</label>
            <select class="dg-select" [(ngModel)]="selectedRegionItem">
              <option *ngFor="let item of catalog.region_items" [value]="item.slug">{{ item.name }}</option>
            </select>
          </div>
          <button dgCommandBtn type="button" (click)="grantRegionItem()" [disabled]="busy()">Grant Item</button>
        </div>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="dg-card p-3 h-100">
        <h2 class="dg-stencil mb-3">Catalog</h2>
        <p class="mb-2">{{ catalog.unit_types.length }} units · {{ catalog.dice_definitions.length }} dice defs</p>
        <p class="mb-3">{{ catalog.region_items.length }} region items</p>
        <button dgCommandBtn="primary" type="button" (click)="resetAccount()" [disabled]="busy()">
          Reset Account
        </button>
      </div>
    </div>
  </div>
</dg-page-frame>
