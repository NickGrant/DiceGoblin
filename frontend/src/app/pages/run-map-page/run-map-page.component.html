<dg-page-frame
  [breadcrumbs]="[{ label: 'HQ', route: '/home' }, { label: 'Run' }]"
  title="Current Run"
  subtitle="Plot the next node and keep the squad moving."
>
  @if (loading() || error() || run()) {
  <div class="vstack gap-2 mb-3">
    @if (loading()) {
    <dg-alert>Loading run map...</dg-alert>
    }
    @if (error()) {
    <dg-alert tone="error">{{ error() }}</dg-alert>
    }
    @if (run()) {
    <dg-alert>Run {{ run()!.run_id }} · {{ run()!.status }}</dg-alert>
    }
  </div>
  }

  @if (run()) {
  <div class="row g-4">
    <div class="col-xl-8">
      <div class="dg-card p-3">
        <svg class="run-map" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMid meet">
          @for (edge of edges(); track edge.edge_id) {
          <line
            [attr.x1]="edgeX(edge.from_node_id)"
            [attr.y1]="edgeY(edge.from_node_id)"
            [attr.x2]="edgeX(edge.to_node_id)"
            [attr.y2]="edgeY(edge.to_node_id)"
            stroke="rgba(35,39,42,0.45)"
            stroke-width="6"
            stroke-linecap="round"
          ></line>
          }
          @for (node of nodes(); track node.id) {
          <g>
            <circle
              [attr.cx]="nodeX(node)"
              [attr.cy]="nodeY(node)"
              r="34"
              [attr.fill]="node.status === 'available' ? '#b91c1c' : (node.status === 'cleared' ? '#006f7a' : '#9ea6ad')"
            ></circle>
            <text [attr.x]="nodeX(node)" [attr.y]="nodeY(node) + 6" text-anchor="middle" fill="#f3efe0" class="run-map__label">
              {{ node.node_type | uppercase }}
            </text>
          </g>
          }
        </svg>
      </div>
    </div>

    <div class="col-xl-4">
      <div class="dg-card p-3 h-100">
        <h2 class="dg-stencil mb-3">Nodes</h2>
        <div class="vstack gap-2">
          @for (node of nodes(); track node.id) {
          <button dgCommandBtn type="button" (click)="openNode(node)" [disabled]="node.status !== 'available' || working()">
            {{ node.node_type }} · {{ node.status }}
          </button>
          }
        </div>

        <div class="d-flex flex-wrap gap-2 mt-4">
          <button dgCommandBtn="muted" type="button" (click)="load()">Refresh</button>
          <button dgCommandBtn="primary" type="button" (click)="abandonRun()" [disabled]="working()">Abandon Run</button>
        </div>
      </div>
    </div>
  </div>
  } @else {
  <dg-alert>No active run.</dg-alert>
  }
</dg-page-frame>
