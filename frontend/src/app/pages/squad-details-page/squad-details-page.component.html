@if (squad(); as squad) {
<dg-page-frame
  [breadcrumbs]="[{ label: 'HQ', route: '/home' }, { label: 'Warband', route: '/warband' }, { label: 'Squad' }]"
  [title]="squad.name"
  [subtitle]="squad.is_active ? 'Active squad.' : 'Saved squad.'"
>
  @if (error() || message()) {
  <div class="vstack gap-2 mb-3">
    @if (error()) {
    <dg-alert tone="error">{{ error() }}</dg-alert>
    }
    @if (message()) {
    <dg-alert tone="success">{{ message() }}</dg-alert>
    }
  </div>
  }

  <div class="row g-4">
    <div class="col-xl-5">
      <div class="dg-card p-3 h-100">
        <h2 class="dg-stencil mb-3">Membership</h2>
        <label class="form-label">Squad Name</label>
        <input class="dg-input mb-3" [(ngModel)]="name" />

        <div class="vstack gap-2">
          @for (unit of availableUnits(); track unit.id) {
          <label class="promote-row">
            <input type="checkbox" [checked]="selectedUnitIds.has(unit.id)" (change)="toggleUnit(unit.id)" />
            <span>{{ unit.name }} · {{ unit.unit_type_name || unit.unit_type_slug }}</span>
          </label>
          }
        </div>
      </div>
    </div>

    <div class="col-xl-7">
      <div class="dg-card p-3 h-100">
        <h2 class="dg-stencil mb-3">Formation</h2>
        <div class="formation-grid">
          @for (cell of formationCells; track cell) {
          <label class="formation-cell">
            <span>{{ cell }}</span>
            <select class="dg-select" [ngModel]="formationAssignments.get(cell) ?? ''" (ngModelChange)="setCell(cell, $event)">
              <option value="">Empty</option>
              @for (unit of availableUnits(); track unit.id) {
              <option [value]="unit.id" [disabled]="!selectedUnitIds.has(unit.id)">{{ unit.name }}</option>
              }
            </select>
          </label>
          }
        </div>

        <div class="d-flex flex-wrap gap-2 mt-4">
          <button dgCommandBtn="primary" type="button" (click)="save()" [disabled]="saving()">
            {{ saving() ? 'Saving...' : 'Save Squad' }}
          </button>
          <button dgCommandBtn="teal" type="button" (click)="activate()" [disabled]="saving() || squad.is_active">
            {{ squad.is_active ? 'Active' : 'Activate Squad' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</dg-page-frame>
} @else {
<dg-page-frame [showHeader]="false">
  <dg-alert tone="error">Squad not found.</dg-alert>
</dg-page-frame>
}
