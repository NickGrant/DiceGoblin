<section class="dg-page-frame route-frame">
  <div class="dg-title-bar p-3 p-md-4">
    <p class="route-frame__eyebrow dg-stencil">Route / Run / Rest</p>
    <h1 class="mb-2">Rest Node</h1>
    <p class="mb-0">Heal up, adjust the squad, and buy emergency supplies.</p>
  </div>

  <div class="p-3 p-md-4">
    <div class="vstack gap-2 mb-3" *ngIf="loading() || error() || message()">
      <div class="dg-alert" *ngIf="loading()">Opening rest...</div>
      <div class="dg-alert dg-alert--error" *ngIf="error()">{{ error() }}</div>
      <div class="dg-alert dg-alert--success" *ngIf="message()">{{ message() }}</div>
    </div>

    <div class="row g-4" *ngIf="restData()">
      <div class="col-xl-5">
        <div class="dg-card p-3 h-100">
          <h2 class="dg-stencil mb-3">Run Squad</h2>
          <div class="vstack gap-2">
            <label class="promote-row" *ngFor="let unit of units()">
              <input type="checkbox" [checked]="selectedUnitIds.has(unit.id)" (change)="toggleUnit(unit.id)" />
              <span>{{ unit.name }}</span>
              <a class="dg-command-btn" [routerLink]="['/warband/units', unit.id]" [queryParams]="{ runId: runId(), nodeId: nodeId }">Unit</a>
            </label>
          </div>
        </div>
      </div>

      <div class="col-xl-7">
        <div class="dg-card p-3 h-100">
          <h2 class="dg-stencil mb-3">Formation</h2>
          <div class="formation-grid">
            <label class="formation-cell" *ngFor="let cell of cells">
              <span>{{ cell }}</span>
              <select class="dg-select" [ngModel]="formationAssignments.get(cell) ?? ''" (ngModelChange)="setCell(cell, $event)">
                <option value="">Empty</option>
                <option *ngFor="let unit of units()" [value]="unit.id" [disabled]="!selectedUnitIds.has(unit.id)">
                  {{ unit.name }}
                </option>
              </select>
            </label>
          </div>

          <div class="d-flex flex-wrap gap-2 mt-4">
            <button class="dg-command-btn" type="button" (click)="saveRestState()" [disabled]="busy()">Save</button>
            <button class="dg-command-btn" type="button" (click)="buyRestItem('basic_unit')" [disabled]="busy()">Buy Unit</button>
            <button class="dg-command-btn" type="button" (click)="buyRestItem('basic_dice')" [disabled]="busy()">Buy Die</button>
            <button class="dg-command-btn dg-command-btn--primary" type="button" (click)="finalizeRest()" [disabled]="busy()">Finalize Rest</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
