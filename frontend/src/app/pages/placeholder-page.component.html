<section class="dg-page-frame placeholder-frame">
  <div class="dg-title-bar p-3 p-md-4">
    <p class="placeholder-frame__eyebrow dg-stencil">{{ eyebrow }}</p>
    <h1 class="mb-2">{{ title }}</h1>
    <p class="mb-0">{{ summary }}</p>
  </div>

  <div class="p-3 p-md-4">
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="dg-card p-4 h-100">
          <h2 class="dg-stencil">Coming Soon</h2>
          <p class="mb-0">This area is not available yet.</p>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="dg-card dg-card-muted p-4 h-100">
          <h3 class="dg-stencil">Status</h3>
          <p class="mb-0">Check back soon.</p>
        </div>
      </div>
    </div>
  </div>
</section>
