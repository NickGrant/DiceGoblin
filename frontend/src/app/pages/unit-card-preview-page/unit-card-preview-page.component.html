<page-frame
  [breadcrumbs]="[{ label: 'HQ', route: '/home' }, { label: 'Unit Card Preview' }]"
  title="Unit Card Preview"
  subtitle="Live preview rail for the compact unit cards."
>
  <section class="warband-units-section">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="m-0 dg-stencil">Preview Units</h2>
    </div>
    <div class="warband-units-rail">
      <div class="warband-units-rail__layout">
        @for (unit of units; track unit.id) {
        <div class="warband-units-rail__tile">
          <dg-unit-grid-object
            [object]="unit"
            [progressBar]="{
              percent: ((unit.xp ?? 0) / (unit.xp_to_next_level ?? 1)) * 100,
              title: 'XP',
              leftLabel: 'XP ' + (unit.xp ?? 0) + '/' + (unit.xp_to_next_level ?? 0),
              tone: 'xp'
            }"
          />
        </div>
        }
      </div>
    </div>
  </section>
</page-frame>
