<page-frame
  [breadcrumbs]="[{ label: 'HQ', route: '/home' }, { label: 'Run', route: '/run/map' }, { label: 'Rest' }]"
  title="Rest Node"
  subtitle="Recover your run squad before moving on."
>
  @if (loading() || error() || message()) {
  <div class="vstack gap-2 mb-3">
    @if (loading()) {
    <dg-alert>Opening rest...</dg-alert>
    }
    @if (error()) {
    <dg-alert tone="error">{{ error() }}</dg-alert>
    }
    @if (message()) {
    <dg-alert tone="success">{{ message() }}</dg-alert>
    }
  </div>
  }

  @if (restData()) {
  <section class="dg-card p-3 p-lg-4">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
      <div>
        <h2 class="dg-stencil mb-1">Recovery</h2>
        <p class="mb-0">Resting restores run units to full health.</p>
      </div>
      <button dgCommandBtn="primary" type="button" (click)="finalizeRest()" [disabled]="busy()">
        {{ busy() ? 'Resting...' : 'Rest' }}
      </button>
    </div>

    @if (restingUnits().length) {
    <dg-run-unit-formation-grid [cells]="formationGrid()" />
    } @else {
    <dg-alert>No run units found for this rest.</dg-alert>
    }
  </section>
  }
</page-frame>
