<dg-page-frame eyebrow="Route / Run / Rest" title="Rest Node" subtitle="Heal up, adjust the squad, and buy emergency supplies.">
  @if (loading() || error() || message()) {
  <div class="vstack gap-2 mb-3">
    @if (loading()) {
    <dg-alert>Opening rest...</dg-alert>
    }
    @if (error()) {
    <dg-alert tone="error">{{ error() }}</dg-alert>
    }
    @if (message()) {
    <dg-alert tone="success">{{ message() }}</dg-alert>
    }
  </div>
  }

  @if (restData()) {
  <div class="row g-4">
    <div class="col-xl-5">
      <div class="dg-card p-3 h-100">
        <h2 class="dg-stencil mb-3">Run Squad</h2>
        <div class="vstack gap-2">
          @for (unit of units(); track unit.id) {
          <label class="promote-row">
            <input type="checkbox" [checked]="selectedUnitIds.has(unit.id)" (change)="toggleUnit(unit.id)" />
            <span>{{ unit.name }}</span>
            <a dgCommandBtn [routerLink]="['/warband/units', unit.id]" [queryParams]="{ runId: runId(), nodeId: nodeId }">Unit</a>
          </label>
          }
        </div>
      </div>
    </div>

    <div class="col-xl-7">
      <div class="dg-card p-3 h-100">
        <h2 class="dg-stencil mb-3">Formation</h2>
        <div class="formation-grid">
          @for (cell of cells; track cell) {
          <label class="formation-cell">
            <span>{{ cell }}</span>
            <select class="dg-select" [ngModel]="formationAssignments.get(cell) ?? ''" (ngModelChange)="setCell(cell, $event)">
              <option value="">Empty</option>
              @for (unit of units(); track unit.id) {
              <option [value]="unit.id" [disabled]="!selectedUnitIds.has(unit.id)">{{ unit.name }}</option>
              }
            </select>
          </label>
          }
        </div>

        <div class="d-flex flex-wrap gap-2 mt-4">
          <button dgCommandBtn type="button" (click)="saveRestState()" [disabled]="busy()">Save</button>
          <button dgCommandBtn type="button" (click)="buyRestItem('basic_unit')" [disabled]="busy()">Buy Unit</button>
          <button dgCommandBtn type="button" (click)="buyRestItem('basic_dice')" [disabled]="busy()">Buy Die</button>
          <button dgCommandBtn="primary" type="button" (click)="finalizeRest()" [disabled]="busy()">Finalize Rest</button>
        </div>
      </div>
    </div>
  </div>
  }
</dg-page-frame>
