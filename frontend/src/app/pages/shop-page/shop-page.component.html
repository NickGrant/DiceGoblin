<dg-page-frame eyebrow="Route / Shop" title="Shop" subtitle="Spend teeth on fresh recruits, basic dice, and the daily deal.">
  @if (error() || message() || catalog()) {
  <div class="vstack gap-2 mb-3">
    @if (error()) {
    <dg-alert tone="error">{{ error() }}</dg-alert>
    }
    @if (message()) {
    <dg-alert tone="success">{{ message() }}</dg-alert>
    }
    @if (catalog()) {
    <dg-alert>Soft Currency: {{ catalog()!.currency_soft }}</dg-alert>
    }
  </div>
  }

  @if (loading()) {
  <dg-alert>Loading shop...</dg-alert>
  }

  @if (catalog()) {
  <div class="row g-4">
    <div class="col-xl-4">
      <div class="dg-card p-3 h-100">
        <h2 class="dg-stencil mb-3">Basic Dice</h2>
        <dg-object-grid
          [objects]="basicDiceGridObjects()"
          [objectComponent]="shopDiceObjectComponent"
          [footerTemplate]="basicDiceActions"
          [pageSize]="3"
          columnClasses="col-12"
          emptyMessage="No basic dice available."
        />
      </div>
    </div>

    <div class="col-xl-4">
      <div class="dg-card p-3 h-100">
        <h2 class="dg-stencil mb-3">Tier 1 Units</h2>
        <dg-object-grid
          [objects]="basicUnitGridObjects()"
          [objectComponent]="shopUnitObjectComponent"
          [footerTemplate]="basicUnitActions"
          [pageSize]="3"
          columnClasses="col-12"
          emptyMessage="No recruits available."
        />
      </div>
    </div>

    <div class="col-xl-4">
      <div class="dg-card p-3 h-100">
        <h2 class="dg-stencil mb-3">Daily Deal</h2>
        <dg-object-grid
          [objects]="dailyDealGridObjects()"
          [objectComponent]="shopDiceObjectComponent"
          [footerTemplate]="dailyDealActions"
          [pageSize]="1"
          columnClasses="col-12"
          emptyMessage="No daily deal available."
        />
      </div>
    </div>
  </div>
  }
</dg-page-frame>

<ng-template #basicDiceActions let-item>
  <button
    dgCommandBtn
    type="button"
    (click)="purchase('basic_dice', item.id)"
    [disabled]="busyKey() === ('basic_dice:' + item.id) || !canAfford(item.cost)"
  >
    {{ busyKey() === ('basic_dice:' + item.id) ? 'Buying...' : 'Buy' }}
  </button>
</ng-template>

<ng-template #basicUnitActions let-item>
  <button
    dgCommandBtn
    type="button"
    (click)="purchase('basic_unit', item.id)"
    [disabled]="busyKey() === ('basic_unit:' + item.id) || !canAfford(item.cost)"
  >
    {{ busyKey() === ('basic_unit:' + item.id) ? 'Buying...' : 'Buy' }}
  </button>
</ng-template>

<ng-template #dailyDealActions let-item>
  <button
    dgCommandBtn="primary"
    type="button"
    (click)="purchase('daily_deal')"
    [disabled]="busyKey() === 'daily_deal:' || catalog()?.daily_deal?.is_purchased || !canAfford(item.cost)"
  >
    {{
      busyKey() === 'daily_deal:'
        ? 'Buying...'
        : catalog()?.daily_deal?.is_purchased
          ? 'Purchased'
          : 'Buy Deal'
    }}
  </button>
</ng-template>
