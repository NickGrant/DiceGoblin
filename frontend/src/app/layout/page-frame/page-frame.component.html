@if (showHeader()) {
  <header class="header--{{ headerVariant() }} dg-motion-panel-enter">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <ol>
        @for (crumb of normalizedBreadcrumbs(); track crumb.label + '-' + $index; let isLast = $last) {
          <li>
            @if (crumb.route && !isLast) {
              <a class="dg-stencil" [routerLink]="crumb.route">{{ crumb.label }}</a>
            } @else {
              <span class="dg-stencil" [attr.aria-current]="isLast ? 'page' : null">
                {{ crumb.label }}
              </span>
            }
          </li>
        }
      </ol>
    </nav>

    <h1 class="mb-2">{{ title() }}</h1>
    @if (subtitle(); as subtitle) {
      <p class="mb-0">{{ subtitle }}</p>
    }
  </header>
}
<div class="dg-motion-stagger">
  <ng-content />
</div>
