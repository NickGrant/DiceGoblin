<header class="game-shell__hud">
  <div class="hud-shell">
    <div class="hud-panel hud-panel--nav">
      <nav class="hud-nav" aria-label="Primary navigation">
        @for (item of navItems; track item.route) {
          <a
            class="hud-icon-link"
            [routerLink]="item.route"
            [queryParams]="item.guide ? guideQueryParams() : null"
            routerLinkActive="is-active"
            [attr.aria-label]="item.ariaLabel"
          >
            <img [src]="item.icon" alt="" />
          </a>
        }
      </nav>
    </div>

    <div class="hud-panel hud-panel--player">
      <div class="hud-stats" aria-label="Commander resources">
        <span class="hud-stat">
          <img src="/assets/ui/icons/energy_16.png" alt="" />
          <span>{{ profile().energyCurrent }} / {{ profile().energyMax }}</span>
        </span>

        <span class="hud-stat">
          <img src="/assets/ui/icons/tooth_16.png" alt="" />
          <span>{{ profile().softCurrency }}</span>
        </span>
      </div>

      <div class="hud-player">
        <span class="hud-player__label dg-stencil">Commander</span>
        <span class="hud-player__name">{{ session().displayName }}</span>
      </div>

      <button class="hud-logout" type="button" (click)="logout()" aria-label="Logout">
        <img src="/assets/ui/icons/icon_logout.png" alt="" />
      </button>

      <button
        class="hud-menu-toggle"
        type="button"
        aria-label="Open menu"
        [attr.aria-expanded]="mobileMenuOpen()"
        (click)="toggleMobileMenu()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      @if (mobileMenuOpen()) {
        <div class="hud-mobile-menu" aria-label="Mobile navigation menu">
          <nav class="hud-mobile-menu__nav" aria-label="Primary navigation">
            @for (item of navItems; track item.route) {
              <a
                class="hud-mobile-link"
                [routerLink]="item.route"
                [queryParams]="item.guide ? guideQueryParams() : null"
                routerLinkActive="is-active"
                [attr.aria-label]="item.ariaLabel"
                (click)="closeMobileMenu()"
              >
                <img [src]="item.icon" alt="" />
                <span>{{ item.label }}</span>
              </a>
            }
          </nav>

          <button class="hud-mobile-logout" type="button" (click)="logout()">
            <img src="/assets/ui/icons/icon_logout.png" alt="" />
            <span>Logout</span>
          </button>
        </div>
      }
    </div>
  </div>
</header>
