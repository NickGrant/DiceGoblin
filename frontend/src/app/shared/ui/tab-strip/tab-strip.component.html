<nav role="tablist" [attr.aria-label]="ariaLabel()" (keydown)="handleKeydown($event)">
  @for (item of items(); track item.id) {
  <button
    #tabOption="dgTabOption"
    dgTabOption
    type="button"
    role="tab"
    [disabled]="item.disabled"
    [attr.data-active]="isActive(item.id) ? '' : null"
    [attr.aria-selected]="isActive(item.id)"
    [attr.aria-label]="item.ariaLabel || item.label"
    [attr.tabindex]="tabIndexFor(item)"
    (click)="select(item)"
  >
    @if (item.kicker) {
    <span data-kicker>{{ item.kicker }}</span>
    }
    <span>{{ item.label }}</span>
  </button>
  }
</nav>
