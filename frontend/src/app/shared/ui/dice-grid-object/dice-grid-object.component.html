<div
  class="sprite"
  [style.background-image]="artStyles().backgroundImage"
  [style.background-position]="artStyles().backgroundPosition"
  [style.background-size]="artStyles().backgroundSize"
></div>

<p class="mb-2">d{{ object().sides }} · {{ object().rarity | titlecase }}</p>

@if (object().affixes?.length) {
  <ul class="dg-list-reset small mb-3">
    @for (affix of object().affixes; track affix.affix_definition_id) {
      <li>{{ affix.name || affix.affix_slug || 'Affix' }} · {{ affix.value }}</li>
    }
  </ul>
}

@if (footerTemplate(); as footerTemplate) {
  <div class="d-flex flex-wrap gap-2 mt-auto">
    <ng-container
      [ngTemplateOutlet]="footerTemplate"
      [ngTemplateOutletContext]="{ $implicit: footerContext() || object() }"
    />
  </div>
}
