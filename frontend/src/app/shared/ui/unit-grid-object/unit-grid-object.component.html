<a class="dg-card dg-card-muted unit-grid-object p-3 h-100" [routerLink]="['/warband/units', object().id]">
  @if (tag()) {
  <span class="unit-grid-object__tag">{{ tag() }}</span>
  }
  @if (object().locked) {
  <span class="unit-grid-object__lock">Locked In Run</span>
  }
  <div class="unit-grid-object__heading mt-2 mb-1">
    <h2 class="h5 m-0">{{ object().name }}</h2>
    @if (formatTier(object().tier); as tierLabel) {
    <span class="unit-grid-object__tier dg-stencil">{{ tierLabel }}</span>
    }
  </div>
  <p class="mb-2">
    {{ object().unit_type_name || object().unit_type_slug || 'Unit' }} Level {{ object().level }}
  </p>

  @if (footerTemplate(); as footerTemplate) {
  <div class="d-flex flex-wrap gap-2 mt-auto">
    <ng-container
      [ngTemplateOutlet]="footerTemplate"
      [ngTemplateOutletContext]="{ $implicit: footerContext() || object() }"
    />
  </div>
  }
</a>
