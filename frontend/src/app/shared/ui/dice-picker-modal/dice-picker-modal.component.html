@if (open()) {
  <div class="dice-picker-backdrop" (click)="close()">
    <section
      class="dice-picker-modal dg-card p-3 p-lg-4"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="'Dice picker for ' + slotLabel()"
      (click)="$event.stopPropagation()"
    >
      <div class="dice-picker-modal__header">
        <div>
          <h2 class="dg-stencil mb-1">Dice Picker</h2>
          <p class="mb-0">{{ slotLabel() }}</p>
        </div>
        <button dgCommandBtn="muted" type="button" (click)="close()" [disabled]="busy()">Close</button>
      </div>

      <div class="dice-picker-modal__current">
        @if (selectedDie(); as die) {
          <p class="mb-0">Current choice: d{{ die.sides }} · {{ die.rarity | titlecase }}</p>
        } @else {
          <p class="mb-0">Current choice: No Choice</p>
        }
      </div>

      <section class="dice-picker-modal__controls dg-card p-3 mb-3">
        <div class="row g-3 align-items-end">
          <div class="col-sm-4">
            <label class="form-label" for="modal-dice-size-filter">Size</label>
            <select
              id="modal-dice-size-filter"
              class="dg-select"
              [ngModel]="selectedSize() ?? ''"
              (ngModelChange)="updateSize($event)"
            >
              <option value="">All sizes</option>
              @for (size of sizeOptions(); track size) {
                <option [value]="size">d{{ size }}</option>
              }
            </select>
          </div>

          <div class="col-sm-4">
            <label class="form-label" for="modal-dice-rarity-filter">Rarity</label>
            <select
              id="modal-dice-rarity-filter"
              class="dg-select"
              [ngModel]="selectedRarity() ?? ''"
              (ngModelChange)="updateRarity($event)"
            >
              <option value="">All rarities</option>
              @for (rarity of rarityOptions(); track rarity) {
                <option [value]="rarity">{{ rarity | titlecase }}</option>
              }
            </select>
          </div>

          <div class="col-sm-4">
            <label class="form-label" for="modal-dice-sort">Sort</label>
            <select
              id="modal-dice-sort"
              class="dg-select"
              [ngModel]="selectedSort()"
              (ngModelChange)="updateSort($event)"
            >
              <option value="size-asc">Size: Small to Large</option>
              <option value="size-desc">Size: Large to Small</option>
              <option value="rarity-asc">Rarity: Common to Legendary</option>
              <option value="rarity-desc">Rarity: Legendary to Common</option>
            </select>
          </div>
        </div>

        <p class="dice-picker-modal__results mb-0 mt-3">
          Showing {{ filteredDice().length }} of {{ dice().length }} dice.
        </p>
      </section>

      <dg-object-grid
        [objects]="filteredDice()"
        [objectComponent]="diceObjectComponent"
        [footerTemplate]="diceActions"
        [leadingTemplate]="noneTile"
        emptyMessage="No dice available for this slot."
        columnClasses="col-3"
        [pageSize]="8"
      />

      <ng-template #noneTile>
        <button
          class="dice-picker-modal__empty-slot"
          type="button"
          (click)="choose(null)"
          [disabled]="busy()"
        >
          <span class="dice-picker-modal__empty-slot-icon">x</span>
          <span class="dg-stencil">None</span>
        </button>
      </ng-template>

      <ng-template #diceActions let-die>
        <button
          dgCommandBtn
          type="button"
          (click)="choose(die.id)"
          [disabled]="busy()"
        >
          {{ selectedDiceId() === die.id ? 'Selected' : 'Choose' }}
        </button>
      </ng-template>
    </section>
  </div>
}
