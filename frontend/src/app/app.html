<div class="app-shell" [class.app-shell--game]="isGameRoute()">
  <div class="app-shell__frame">
    @if (!isGameRoute() && (isLoading() || error())) {
      <div class="dg-card status-card" [class.status-card--error]="!!error()">
        <strong class="dg-stencil">{{ error() ? 'Comms Disrupted' : 'Checking Session' }}</strong>
        <span>{{ error() || 'Connecting to the account service.' }}</span>
      </div>
    }

    <router-outlet></router-outlet>
  </div>
</div>
