name: Full Verification

on:
  pull_request:
  push:
    branches:
      - main
      - vnext-game-overhaul

concurrency:
  group: full-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install backend dependencies
        run: composer --working-dir=backend install --no-interaction --no-progress

      - name: Run compact package verification
        run: npm run verify:package -- --continue-on-failure

      - name: Upload package verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-verification-${{ github.sha }}
          path: artifacts/verification/
          if-no-files-found: warn
